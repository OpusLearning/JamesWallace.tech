name: Build and Deploy Frontend

on:
  push:
    branches:
      - main

# The workflow only reads the repository; deployment credentials come from repository secrets.
permissions:
  contents: read

# One deploy at a time, and never cancel one halfway through an rsync.
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Build, prove and test frontend
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci
          # Build first: the browser tests reuse dist/ rather than each rebuilding it, which keeps
          # a clean CI checkout from running two concurrent builds over the same directory.
          npm run build
          # Prove the build includes public/, rather than trusting that it must.
          test -f dist/sitemap.xml || { echo 'dist/sitemap.xml missing - build did not include public/'; exit 1; }
          npm test

      - name: Install and test server
        working-directory: server
        run: |
          set -euo pipefail
          npm ci
          npm test

      # No third-party SSH action: set up the runner's own OpenSSH from repository secrets.
      # SERVER_SSH_KEY is the private half of the deploy key; SERVER_KNOWN_HOSTS is the pinned
      # host key, so the runner never trusts a key it has not seen before.
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy frontend build
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
          SSH_PORT: ${{ secrets.SERVER_PORT || '22' }}
        run: |
          set -euo pipefail
          # --delete is safe here: dist/ contains only build output.
          rsync -az --delete \
            -e "ssh -i $HOME/.ssh/deploy_key -p ${SSH_PORT} -o StrictHostKeyChecking=yes" \
            frontend/dist/ "${SSH_USER}@${SSH_HOST}:/var/www/jameswallace.tech/frontend/dist/"

      - name: Deploy server code
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
          SSH_PORT: ${{ secrets.SERVER_PORT || '22' }}
        run: |
          set -euo pipefail
          # No --delete: this directory holds orders.db and the service's .env, neither of which
          # may ever be removed by a deploy.
          rsync -az \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'node_modules/' \
            --exclude '*.db' \
            --exclude '*.db-*' \
            --exclude '*.log' \
            -e "ssh -i $HOME/.ssh/deploy_key -p ${SSH_PORT} -o StrictHostKeyChecking=yes" \
            server/ "${SSH_USER}@${SSH_HOST}:/var/www/jameswallace.tech/server/"

      - name: Install server dependencies, restart and reload
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
          SSH_PORT: ${{ secrets.SERVER_PORT || '22' }}
        run: |
          set -euo pipefail
          # set -euo pipefail runs inside the remote shell too, so a failed install or restart
          # fails the job instead of being masked by a later successful command.
          ssh -i "$HOME/.ssh/deploy_key" -p "${SSH_PORT}" -o StrictHostKeyChecking=yes \
            "${SSH_USER}@${SSH_HOST}" '
              set -euo pipefail
              cd /var/www/jameswallace.tech/server
              npm ci --omit=dev
              sudo systemctl restart jw-server
              sudo systemctl reload nginx
            '
